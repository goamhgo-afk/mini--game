<!doctype html><html lang="fa" dir="rtl"><head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Game</title><link rel="stylesheet" href="style.css"></head><body><header><b>MINI <i>GAME</i></b><nav><a href="#home">خانه</a><a href="#devices">دستگاه‌ها</a><a href="#booking">رزرو</a><a href="admin.html">مدیریت</a></nav><button id="theme" type="button">☾</button></header><section class="hero" id="home"><div><small>🎮 GAMING LOUNGE</small><h1>وقتشه <i>بازی کنی.</i></h1><p>رزرو سریع PS4 در Mini Game؛ دستگاهت را انتخاب کن و زمانت را بگیر.</p><a href="#booking" class="cta">رزرو PS4 ←</a></div><div class="heroCard"><b>۳</b><span>دستگاه PS4</span><strong>۵۰٬۰۰۰ تومان / ساعت</strong></div></section><section id="devices"><h2>دستگاه‌ها</h2><div id="grid" class="grid"></div></section><section id="booking"><h2>رزرو سریع</h2><form id="form" novalidate><label>دستگاه<select id="device"></select></label><label>تاریخ رزرو<div class="jalali"><select id="jy" required aria-label="سال"></select><select id="jm" required aria-label="ماه"></select><select id="jd" required aria-label="روز"></select></div><input id="date" type="hidden"></label><label>ساعت شروع<select id="start" required></select></label><label>مدت<select id="duration"><option value="1">۱ ساعت</option><option value="2">۲ ساعت</option><option value="3">۳ ساعت</option><option value="4">۴ ساعت</option></select></label><label>نام<input id="customer" required></label><label>شماره تماس<input id="phone" inputmode="tel" maxlength="11" required placeholder="09xxxxxxxxx"></label><label class="football-option"><input id="football" type="checkbox"><span>⚽ بازی با فوتبال دستی</span><small id="footballPriceText"></small></label><div class="total">مبلغ نهایی: <b id="total"></b></div><button class="cta" type="submit">ثبت رزرو 🎮</button></form><div id="result"></div></section><section class="cancel-box"><h2>لغو رزرو</h2><p>اگر منصرف شدی، کد رزرو و شماره تماس را وارد کن.</p><form id="cancelForm" novalidate><input id="cancelCode" placeholder="کد رزرو" required><input id="cancelPhone" placeholder="شماره تماس" inputmode="tel" maxlength="11" required><button type="submit">لغو رزرو</button></form><div id="cancelResult"></div></section><footer>MINI GAME · رزرو گیم‌نت</footer><script src="app.js"></script></body></html>
